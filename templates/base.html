<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ name }} - Executive Portfolio{% endblock %}</title>



    <!-- Dark Mode Toggle Button -->
<button id="themeToggle" style="position: fixed; top: 20px; right: 20px; padding: 10px 15px; border-radius: 50px; border: none; cursor: pointer; font-size: 1.2rem; background: var(--card-bg); color: var(--text-color); box-shadow: var(--shadow); z-index: 1000;">
    🌙
</button>


    <!-- ===== CSS FILES ===== -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
</head>
<body>
    {% block content %}{% endblock %}

    <!-- ===== JAVASCRIPT FILES ===== -->
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/typing.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
